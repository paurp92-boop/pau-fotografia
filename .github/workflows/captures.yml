name: Captures per a l'editor d'Instagram
on:
  push:
    branches: [main]
    paths-ignore: ['captures/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: captures
  cancel-in-progress: true
jobs:
  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright pillow && playwright install --with-deps chromium
      - name: Captures de la web (mòbil, ca/es/en)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python3 tools/captures.py http://localhost:8765/ captures
      - name: Desa-les si han canviat
        run: |
          git config user.name "captures-bot"
          git config user.email "captures-bot@users.noreply.github.com"
          git add captures
          git diff --cached --quiet || (git commit -m "Captures de la web actualitzades [skip ci]" && git push)
